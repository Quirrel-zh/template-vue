  <body>
    <div id="app"></div>

  <style>
    ::-webkit-scrollbar {
      /*滚动条整体样式*/
      width: 8px; /*高宽分别对应横竖滚动条的尺寸*/
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      /*滚动条里面小方块*/
      border-radius: 4px;
      background: #dcdee2;
    }

    ::-webkit-scrollbar-track {
      /*滚动条里面轨道*/
      background: #fff;
    }
  </style>
